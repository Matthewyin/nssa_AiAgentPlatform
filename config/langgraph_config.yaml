# LangGraph 配置
langgraph:
  # Graph执行配置
  execution:
    max_steps: 20  # 最大执行步数
    timeout: 120  # 超时时间(秒)
    stream_mode: "values"  # 流式模式: values, updates, debug
    
  # Router节点配置
  router:
    # 关键词路由规则
    # 注意：每条规则的关键词数量会影响匹配分数
    # 分数 = 匹配关键词数 / 总关键词数
    # 建议每条规则 2-4 个相关关键词，以获得合理的匹配分数
    keyword_rules:
      # 网络诊断 - 按工具类型分组
      - keywords: ["ping", "连通"]
        target_node: "network_agent"
        priority: 1
      - keywords: ["traceroute", "路径追踪"]
        target_node: "network_agent"
        priority: 1
      - keywords: ["nslookup", "dns解析"]
        target_node: "network_agent"
        priority: 1
      - keywords: ["mtr", "网络诊断"]
        target_node: "network_agent"
        priority: 1
      - keywords: ["tcp", "端口"]
        target_node: "network_agent"
        priority: 1
      - keywords: ["tls", "证书"]
        target_node: "network_agent"
        priority: 1
      - keywords: ["http", "https", "网站"]
        target_node: "network_agent"
        priority: 1
      - keywords: ["延迟", "丢包", "可达"]
        target_node: "network_agent"
        priority: 1
      
      # 绘图 Agent
      - keywords: ["拓扑", "拓扑图"]
        target_node: "diagram_agent"
        priority: 1
      - keywords: ["绘图", "画图", "网络图"]
        target_node: "diagram_agent"
        priority: 1
      - keywords: ["mermaid", "excalidraw", "drawio"]
        target_node: "diagram_agent"
        priority: 1
      
      # 数据库 Agent
      - keywords: ["数据库", "mysql"]
        target_node: "database_agent"
        priority: 1
      - keywords: ["查询", "表"]
        target_node: "database_agent"
        priority: 1
      - keywords: ["sql", "select"]
        target_node: "database_agent"
        priority: 1
      
      # 知识库 Agent
      - keywords: ["知识库", "文档"]
        target_node: "gemini_rag_agent"
        priority: 1
      - keywords: ["RAG", "检索"]
        target_node: "gemini_rag_agent"
        priority: 1
      - keywords: ["历史案例", "查找文档"]
        target_node: "gemini_rag_agent"
        priority: 1
    
    # 是否使用LLM作为后备路由
    use_llm_fallback: true
    
    # LLM路由的Prompt
    llm_router_prompt: |
      根据用户的问题,判断应该使用哪个Agent:
      - network_agent: 处理网络诊断相关问题(ping, traceroute, DNS, MTR, TCP, HTTP, TLS 等连通性测试)
      - diagram_agent: 处理网络拓扑图绘制(Mermaid, Excalidraw, Draw.io)
      - database_agent: 处理数据库查询相关问题(MySQL查询、表结构查看等)
      - gemini_rag_agent: 处理知识库检索、文档查询、历史案例查询


      用户问题: {query}

      只返回Agent名称,不要有其他内容。
      
  # 节点配置
  nodes:
    user_input:
      validate_input: true  # 是否验证输入
      max_length: 8000  # 最大输入长度
      
    network_agent:
      timeout: 60  # 节点超时时间
      retry_on_error: true  # 是否在错误时重试
      max_retries: 1

    diagram_agent:
      timeout: 60
      retry_on_error: true
      max_retries: 1

    database_agent:
      timeout: 60
      retry_on_error: true
      max_retries: 1

    gemini_rag_agent:
      timeout: 60
      retry_on_error: true
      max_retries: 1
      
    final_answer:
      format_output: true  # 是否格式化输出
      include_metadata: true  # 是否包含元数据
