# 工具配置
# 定义所有MCP工具的参数schema和默认值

tools:
  # 网络诊断工具
  network:
    ping:
      name: "network.ping"
      description: "使用 ICMP ping 检查目标主机的可达性和网络延迟。返回丢包率、最小/最大/平均延迟等统计信息。"
      parameters:
        target:
          type: "string"
          description: "目标主机的 IP 地址或域名"
          required: true
        count:
          type: "integer"
          description: "发送 ping 包的数量"
          default: 4
          min: 1
          max: 100
        timeout:
          type: "integer"
          description: "超时时间(秒)"
          default: 10
          min: 1
          max: 60
      timeout: 30
      runner:
        type: "netprobe"
        command: "${NETPROBE_BIN}"
        subcommand: "ping"
        args:
          target: "--target"
          count: "--count"
          timeout: "--timeout"

    traceroute:
      name: "network.traceroute"
      description: "路由追踪：追踪到目标主机的网络路径，返回每跳的 IP 地址、主机名和延迟。"
      parameters:
        target:
          type: "string"
          description: "目标主机的 IP 地址或域名"
          required: true
        max_hops:
          type: "integer"
          description: "最大跳数"
          default: 30
          min: 1
          max: 64
        timeout:
          type: "integer"
          description: "超时时间(秒)"
          default: 60
          min: 10
          max: 120
      timeout: 120
      runner:
        type: "netprobe"
        command: "${NETPROBE_BIN}"
        subcommand: "trace"
        args:
          target: "--target"
          max_hops: "--max-hops"
          timeout: "--timeout"

    nslookup:
      name: "network.nslookup"
      description: "DNS 解析查询：返回完整的解析链路（包括 CNAME 跳转）、每条记录的 TTL、使用的 DNS 服务器、解析耗时。支持多种记录类型查询。"
      parameters:
        target:
          type: "string"
          description: "要查询的域名"
          required: true
        record_type:
          type: "string"
          description: "DNS 记录类型"
          default: "A"
          enum: ["A", "AAAA", "MX", "NS", "TXT", "CNAME", "SOA", "PTR", "SRV"]
        dns_server:
          type: "string"
          description: "指定 DNS 服务器（可选，默认使用系统 DNS）"
          required: false
        timeout:
          type: "integer"
          description: "超时时间(秒)"
          default: 10
          min: 1
          max: 30
      timeout: 15
      runner:
        type: "netprobe"
        command: "${NETPROBE_BIN}"
        subcommand: "nslookup"
        args:
          target: "--target"
          record_type: "--record-type"
          dns_server: "--dns-server"
          timeout: "--timeout"

    mtr:
      name: "network.mtr"
      description: "MTR 网络路径追踪：结合 ping 和 traceroute 功能，返回每跳的结构化数据（IP、主机名、丢包率、延迟统计 min/max/avg/std_dev）。自动标识高丢包跳点（>20%）和超时跳点。"
      parameters:
        target:
          type: "string"
          description: "目标主机的 IP 地址或域名"
          required: true
        count:
          type: "integer"
          description: "发送的测试包数量"
          default: 10
          min: 1
          max: 100
        report_cycles:
          type: "integer"
          description: "报告周期数"
          default: 10
          min: 1
          max: 100
        timeout:
          type: "integer"
          description: "超时时间(秒)"
          default: 60
          min: 10
          max: 300
      timeout: 120
      runner:
        type: "netprobe"
        command: "${NETPROBE_BIN}"
        subcommand: "mtr"
        use_sudo: true
        args:
          target: "--target"
          count: "--count"
          report_cycles: "--report-cycles"
          timeout: "--timeout"

    tcp:
      name: "network.tcp"
      description: "TCP 探测：建立 TCP 连接并返回握手耗时。用于检测端口是否开放、连接是否被拒绝或超时。支持重试机制。"
      parameters:
        host:
          type: "string"
          description: "目标主机（域名或 IP）"
          required: true
        port:
          type: "integer"
          description: "目标端口"
          required: true
          min: 1
          max: 65535
        timeout:
          type: "integer"
          description: "超时时间(秒)"
          default: 10
          min: 1
          max: 60
        retry:
          type: "integer"
          description: "重试次数"
          default: 0
          min: 0
          max: 5
      timeout: 30
      runner:
        type: "netprobe"
        command: "${NETPROBE_BIN}"
        subcommand: "tcp"
        args:
          host: "--host"
          port: "--port"
          timeout: "--timeout"
          retry: "--retry"

    tls:
      name: "network.tls"
      description: "TLS 探测：执行 TLS 握手并返回详细的证书信息（主题、颁发者、有效期、剩余天数、SHA256 指纹）、连接信息（协议版本、加密套件、是否 mTLS）、时间分解（TCP 连接、TLS 握手）。证书即将过期（<30天）时自动标记警告。"
      parameters:
        host:
          type: "string"
          description: "目标主机（域名或 IP）"
          required: true
        port:
          type: "integer"
          description: "目标端口"
          required: true
          default: 443
          min: 1
          max: 65535
        server_name:
          type: "string"
          description: "SNI 主机名（用于证书校验，默认使用 host 参数）"
          required: false
        timeout:
          type: "integer"
          description: "超时时间(秒)"
          default: 10
          min: 1
          max: 60
        insecure:
          type: "boolean"
          description: "跳过证书校验（用于自签名证书）"
          default: false
        ca_cert:
          type: "string"
          description: "自定义根证书路径"
          required: false
        client_cert:
          type: "string"
          description: "客户端证书路径（用于双向 TLS/mTLS）"
          required: false
        client_key:
          type: "string"
          description: "客户端私钥路径（用于双向 TLS/mTLS）"
          required: false
      timeout: 30
      runner:
        type: "netprobe"
        command: "${NETPROBE_BIN}"
        subcommand: "tls"
        args:
          host: "--host"
          port: "--port"
          server_name: "--server-name"
          timeout: "--timeout"
          insecure: "--insecure"
          ca_cert: "--ca-cert"
          client_cert: "--client-cert"
          client_key: "--client-key"

    http:
      name: "network.http"
      description: "HTTP 探测：发起 HTTP/HTTPS 请求并验证状态码与响应。支持完整的时间分解（DNS、TCP、TLS、等待、传输）、重定向链路追踪、关键响应头提取。"
      parameters:
        url:
          type: "string"
          description: "目标 URL（支持 http:// 和 https://）"
          required: true
        method:
          type: "string"
          description: "HTTP 方法"
          default: "GET"
          enum: ["GET", "POST", "PUT", "DELETE", "HEAD", "OPTIONS", "PATCH"]
        headers:
          type: "object"
          description: "请求头键值对，如 {\"Authorization\": \"Bearer xxx\"}"
          required: false
        body:
          type: "string"
          description: "请求体（用于 POST/PUT 等方法）"
          required: false
        timeout:
          type: "integer"
          description: "超时时间(秒)"
          default: 15
          min: 1
          max: 300
        expect_status:
          type: "integer"
          description: "预期状态码，不匹配时标记为失败"
          required: false
        expect_contains:
          type: "string"
          description: "响应体期望包含的字符串"
          required: false
        follow_redirects:
          type: "boolean"
          description: "是否跟随重定向"
          default: true
        max_redirects:
          type: "integer"
          description: "最大重定向次数"
          default: 10
          min: 0
          max: 20
      timeout: 60
      runner:
        type: "netprobe"
        command: "${NETPROBE_BIN}"
        subcommand: "http"
        args:
          url: "--url"
          method: "--method"
          timeout: "--timeout"
          expect_status: "--expect-status"
          expect_contains: "--expect-contains"
          body: "--body"
          headers: "--headers"
          follow_redirects: "--follow-redirects"
          max_redirects: "--max-redirects"

    diagnose:
      name: "network.diagnose"
      description: "综合网络诊断：一键执行完整的网络诊断链（DNS → TCP → TLS → HTTP），返回包含所有探测结果的综合报告，并生成诊断结论和建议。适用于快速排查目标服务的连通性问题。"
      parameters:
        target:
          type: "string"
          description: "目标域名或 URL（如 example.com 或 https://example.com/api）"
          required: true
        port:
          type: "integer"
          description: "目标端口（默认根据协议自动选择：HTTP=80, HTTPS=443）"
          required: false
          default: 443
          min: 1
          max: 65535
        skip:
          type: "array"
          description: "跳过的探测步骤列表，可选值：dns, tcp, tls, http, mtr"
          required: false
        parallel:
          type: "boolean"
          description: "是否并行探测多个 IP（当 DNS 解析出多个 IP 时）"
          default: false
        timeout:
          type: "integer"
          description: "总超时时间(秒)"
          default: 60
          min: 10
          max: 300
        include_mtr:
          type: "boolean"
          description: "是否包含 MTR 路径追踪（耗时较长）"
          default: false
        probe_id:
          type: "string"
          description: "探测源标识（用于区分不同探测点）"
          required: false
      timeout: 120
      runner:
        type: "netprobe"
        command: "${NETPROBE_BIN}"
        subcommand: "diagnose"
        args:
          target: "--target"
          port: "--port"
          skip: "--skip"
          parallel: "--parallel"
          timeout: "--timeout"
          include_mtr: "--mtr"
          probe_id: "--probe-id"

  # 绘图生成工具
  diagram:
    generate_mermaid:
      name: "diagram.generate_mermaid"
      description: "生成 Mermaid 格式的网络拓扑图代码。必须遵循严格的4级层次结构：环境->数据中心->网络区域->设备。确保所有设备都在对应的区域容器内，区域在数据中心内，数据中心在环境内。"
      parameters:
        nodes:
          type: "array"
          description: "节点列表，必须包含完整的层次结构信息"
          required: true
        edges:
          type: "array"
          description: "边列表"
          required: true
        containers:
          type: "array"
          description: "容器/子图列表，必须包含Environment, DataCenter, NetworkArea类型的容器"
          required: false
      timeout: 30

    generate_excalidraw:
      name: "diagram.generate_excalidraw"
      description: "生成 Excalidraw 文件下载链接。必须遵循严格的4级层次结构：环境->数据中心->网络区域->设备。"
      parameters:
        nodes:
          type: "array"
          description: "节点列表"
          required: true
        edges:
          type: "array"
          description: "边列表"
          required: true
        containers:
          type: "array"
          description: "容器/子图列表，包含Environment, DataCenter, NetworkArea类型的容器"
          required: false
      timeout: 30

    generate_drawio:
      name: "diagram.generate_drawio"
      description: "生成 Draw.io 文件下载链接。必须遵循严格的4级层次结构：环境->数据中心->网络区域->设备。"
      parameters:
        nodes:
          type: "array"
          description: "节点列表"
          required: true
        edges:
          type: "array"
          description: "边列表"
          required: true
        containers:
          type: "array"
          description: "容器/子图列表，包含Environment, DataCenter, NetworkArea类型的容器"
          required: false
      timeout: 30




  # MySQL 数据库工具
  # 注意：这些工具定义仅用于文档和提示，实际工具由 mcp-server-mysql 提供
  # mcp-server-mysql 提供的工具：execute_query, create_table, insert_data, fetch_data, list_tables, describe_table
  # ⚠️ 重要：这些工具都不支持 database 参数！需要在 SQL 中使用 database.table 格式来访问不同数据库
  mysql:
    list_tables:
      name: "mysql.list_tables"
      description: "列出默认数据库中的所有表。注意：此工具只能列出默认数据库的表，不支持 database 参数。如需查询其他数据库的表，请使用 execute_query 执行 SHOW TABLES FROM database_name"
      parameters: {}
      timeout: 10

    describe_table:
      name: "mysql.describe_table"
      description: "查看指定表的结构。注意：此工具不支持 database 参数，只能查询默认数据库中的表。如需查询其他数据库的表结构，请使用 execute_query 执行 DESCRIBE database_name.table_name"
      parameters:
        table:
          type: "string"
          description: "表名（如需查询其他数据库的表，请使用 execute_query）"
          required: true
      timeout: 10

    execute_query:
      name: "mysql.execute_query"
      description: "执行 SQL 查询语句。注意：此工具不支持 database 参数。如需查询其他数据库，必须在 SQL 中使用 database.table 格式，例如 SELECT * FROM mail_db.requirements_track"
      parameters:
        query:
          type: "string"
          description: "SQL 查询语句。跨数据库查询时使用 database.table 格式，如 SELECT * FROM mail_db.requirements_track"
          required: true
      timeout: 30

    fetch_data:
      name: "mysql.fetch_data"
      description: "从指定表获取数据（仅限默认数据库）。如需查询其他数据库，请使用 execute_query"
      parameters:
        table_name:
          type: "string"
          description: "表名"
          required: true
        limit:
          type: "integer"
          description: "返回结果数量限制"
          default: 100
      timeout: 30

  # Gemini RAG 工具
  gemini_rag:
    list_stores:
      name: "gemini_rag.list_stores"
      description: "列出所有 Gemini File Search Store（知识库）"
      parameters: {}
      timeout: 30

    list_documents:
      name: "gemini_rag.list_documents"
      description: "列出指定知识库中的所有文档"
      parameters:
        store_name:
          type: "string"
          description: "知识库名称，如 fileSearchStores/xxx 或简短名称"
          required: true
      timeout: 30

    search:
      name: "gemini_rag.search"
      description: "在指定知识库中进行 RAG 语义检索"
      parameters:
        store_name:
          type: "string"
          description: "知识库名称"
          required: true
        query:
          type: "string"
          description: "检索查询内容"
          required: true
      timeout: 60
